#-------------------------------
# General Site Settings

title: The Power of Words
description: On change, dialectical repair, and empowerment through exploration of the power of words. # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://thepowerofwords.net" # the base hostname & protocol for your site, e.g. http://example.com
url_local: "http://localhost:4000/"
logo: Logo1.png


#-------------------------------




#-------------------------------
# Contact links
twitter:   https://twitter.com/powerowords
email: agathos@thepowerofwords.net
#instagram: https://www.instagram.com/


#-------------------------------
# Comment Section (Disqus)
disqus-identifier: thepowerofwords-net # Add your shortname for Disqus Comment. For example mr-brown


#-------------------------------
# Google Analytics
google-analytics: # Add your identifier. For example UA-99631805-1.


#-------------------------------
# Build settings
markdown: kramdown
permalink: ':title/'
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-email-protect

paginate: 5
paginate_path: "/page/:num"

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed


